      barStyle: `height:100%;width:${(count / 6) * 100}%;background:linear-gradient(90deg,#FFE08A,#FFC24D,#FF9A3C,#FF6A3D,#F2456A,#D81670,#8E2A9E);border-radius:999px;transition:width .5s`,
      stuckOpts: [opt('seen', 'Getting seen'), opt('subs', 'Getting subscribers'), opt('paid', 'Getting paid')],
      hasStuck: !!stuckKey, stuck: STUCK[stuckKey || 'seen'],
      stack: STACK.map((x) => ({ ...x, val: money(x.v) })),
      bonuses: BONUSES.map((x) => ({ ...x, val: money(x.v) })),
      partsTotal: money(pt), bonusTotal: money(bt), allTotal: money(pt + bt),
      faq: FAQ.map((f, i) => ({ ...f, open: s.faq === i, sign: s.faq === i ? '−' : '+', toggle: () => this.setState({ faq: s.faq === i ? -1 : i }) })),
      z1: setZ(1), z2: setZ(2), z3: setZ(3), z4: setZ(4), z5: setZ(5), z6: setZ(6), zclose: setZ(0),
      zoomOn: z > 0, zoom1: z === 1, zoom2: z === 2, zoom3: z === 3, zoom4: z === 4, zoom5: z === 5, zoom6: z === 6
    };
  }
}

const comp = new Component();
const TPL = document.getElementById('page').content;
const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
function look(scope, path) {
  if (path === 'true') return true; if (path === 'false') return false;
  if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
  return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), scope);
}
function whole(v) { const m = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/.exec(v || ''); return m ? m[1] : null; }
function interp(scope, s) { return s.replace(HOLE, (_, p) => { const v = look(scope, p); return v == null ? '' : String(v); }); }
function build(node, scope, outParent) {
  if (node.nodeType === 3) { outParent.appendChild(document.createTextNode(interp(scope, node.data))); return; }
  if (node.nodeType !== 1) return;
  const tag = node.tagName.toLowerCase();
  if (tag === 'sc-for') {
    const list = look(scope, whole(node.getAttribute('list'))) || []; const as = node.getAttribute('as');
    list.forEach((item, i) => { const s2 = Object.create(scope); s2[as] = item; s2.$index = i; node.childNodes.forEach(c => build(c, s2, outParent)); });
    return;
  }
  if (tag === 'sc-if') { if (look(scope, whole(node.getAttribute('value')))) node.childNodes.forEach(c => build(c, scope, outParent)); return; }
  if (tag === 'dc-import') { const t = document.getElementById('mock-' + node.getAttribute('name')); t.content.childNodes.forEach(c => build(c, scope, outParent)); return; }
  const el = node.namespaceURI === 'http://www.w3.org/2000/svg' ? document.createElementNS(node.namespaceURI, node.tagName) : document.createElement(node.tagName);
  for (const a of node.attributes) {
    if (a.name.startsWith('hint-')) continue;
    if (/^on[a-z]+$/i.test(a.name)) { el.__h = look(scope, whole(a.value)); el.__ev = a.name.slice(2).toLowerCase(); continue; }
    el.setAttribute(a.name, interp(scope, a.value));
  }
  const src = node.tagName.toLowerCase() === 'template' ? node.content : node;
  src.childNodes.forEach(c => build(c, scope, el));
  outParent.appendChild(el);
}
function listen(el) { if (el.__h && !el.__lis) { el.__lis = true; el.addEventListener(el.__ev, e => el.__h && el.__h(e)); } }
function patch(oldEl, newEl) {
  if (oldEl.nodeType === 1) {
    for (const a of [...oldEl.attributes]) if (!newEl.hasAttribute(a.name)) oldEl.removeAttribute(a.name);
    for (const a of newEl.attributes) if (oldEl.getAttribute(a.name) !== a.value) oldEl.setAttribute(a.name, a.value);
    oldEl.__h = newEl.__h; oldEl.__ev = newEl.__ev; listen(oldEl);
  }
  const oc = [...oldEl.childNodes], nc = [...newEl.childNodes];
  for (let i = 0; i < Math.max(oc.length, nc.length); i++) {
    const o = oc[i], n = nc[i];
    if (!o) { oldEl.appendChild(n); hookAll(n); }
    else if (!n) oldEl.removeChild(o);
    else if (o.nodeType === 3 && n.nodeType === 3) { if (o.data !== n.data) o.data = n.data; }
    else if (o.nodeType === 1 && n.nodeType === 1 && o.tagName === n.tagName) patch(o, n);
    else { oldEl.replaceChild(n, o); hookAll(n); }
  }
}
function hookAll(el) { if (el.nodeType !== 1) return; listen(el); el.querySelectorAll('*').forEach(listen); }
const app = document.getElementById('app');
function render() {
  const vals = comp.renderVals();
  const frag = document.createElement('div');
  TPL.childNodes.forEach(c => build(c, vals, frag));
  if (!app.firstChild) { while (frag.firstChild) { const n = frag.firstChild; app.appendChild(n); hookAll(n); } }
  else patch(app, frag);
}
render();
if (comp.componentDidMount) comp.componentDidMount();

</script>
